name: CI/CD Pipeline for fib

on:
  push:
    branches: main
    tags: '*'
  pull_request:
    branches: main

env:
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/fib

jobs:
  build-and-test:
    name: Build and test fib
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make

      - name: Build fib
        run: make all
        working-directory: .

      - name: Run tests
        run: |
          chmod +x ./run_test.sh
          ./run_test.sh
        working-directory: .

      - name: Package as Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest -f ./Dockerfile .
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:latest ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to Docker Hub
        run: |
          docker login -u ${{ vars.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
